<!DOCTYPE html>
<meta charset="utf-8">

<head>
    <script type="text/javascript" src="lib/d3.v5.min.js"></script>
    <script type="text/javascript" src="lib/d3-dsv.min.js"></script>
    <script type="text/javascript" src="lib/d3-geo-projection.v2.min.js"></script>
    <script type="text/javascript" src="lib/d3-legend.min.js"></script>
    <script type="text/javascript" src="lib/d3-tip.min.js"></script>
    <script type="text/javascript" src="lib/topojson.v2.min.js"></script>

    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
        }

        text {
            fill: #fff;
        }

        select {
            background-color: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 4px;
        }

        label {
            color: #fff;
        }

        .d3-tip {
            line-height: 1;
            padding: 8px;
            background: #fff;
            color: #000;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>

    <title></title>
</head>

<body>
    <label for="severity-dropdown"><strong>Call Severity:</strong></label>
    <select id="severity-dropdown"></select>
    <label for="borough-dropdown"><strong>Borough:</strong></label>
    <select id="borough-dropdown"></select>
    <script>
        var borough = "All";
        var severity = "All";
        var boroughs = ["All", "Bronx", "Brooklyn", "Manhattan", "Queens", "Staten Island"];
        var severities = ["All", "Low", "Serious", "Critical"];
        var width = 800, height = 600;
        var svg = d3.select("body").append("svg")
            .attr("id", "choropleth")
            .attr("width", width)
            .attr("height", height);
        var color = d3.scaleSequential(d3.interpolateViridis);
        var tip = d3.tip()
            .attr("id", "tooltip")
            .attr("class", "d3-tip");
        svg.call(tip);

        var projection = d3.geoMercator()
            .center([-74.0060, 40.7128])
            .translate([width / 2, height / 2]);
        var path = d3.geoPath().projection(projection);

        var global_min, global_max;
        var geo_data, overall_data, borough_data;

        Promise.all([
            d3.json("data/nyc_boroughs.json"),
            d3.csv("../data/overall_visualization_data.csv", d => load_row(d, "All NYC")),
            d3.csv("../data/BRONX_visualization_data.csv", d => load_row(d, "Bronx")),
            d3.csv("../data/BROOKLYN_visualization_data.csv", d => load_row(d, "Brooklyn")),
            d3.csv("../data/MANHATTAN_visualization_data.csv", d => load_row(d, "Manhattan")),
            d3.csv("../data/QUEENS_visualization_data.csv", d => load_row(d, "Queens")),
            d3.csv("../data/RICHMOND___STATEN_ISLAND_visualization_data.csv", d => load_row(d, "Staten Island"))
        ]).then(data => {
            geo_data = data[0];
            overall_data = data[1];
            borough_data = data.slice(2).reduce((acc, rows) => acc.concat(rows), []);
            global_min = d3.min(borough_data.concat(overall_data), d => d.response_90th);
            global_max = d3.max(borough_data.concat(overall_data), d => d.response_90th);
            update();
        });

        function load_row(d, borough) {
            severity_map = { "ALL_SEVERITIES_RESP_90TH": "All", "CRITICAL_RESP_90TH": "Critical", "SERIOUS_RESP_90TH": "Serious", "LOW_ACUITY_RESP_90TH": "Low" }
            s = severity_map[d.Target_Response_Time]
            return {
                borough: borough,
                severity: s,
                response_90th: +d.Current_Avg_Wait_Time,
                crit_vol: +d.Current_Avg_Crit_Vol,
                ser_vol: +d.Current_Avg_Ser_Vol,
                low_vol: +d.Current_Avg_Low_Vol
            };
        }

        function update() {
            var severity_dropdown = d3.select("#severity-dropdown")
                .on("change", function () {
                    severity = this.value;
                    overall_tooltip(severity, borough, overall_data);
                    map();
                });
            severity_dropdown.selectAll("option")
                .data(severities)
                .enter()
                .append("option")
                .attr("value", d => d)
                .text(d => d);
            severity_dropdown.property("value", severity);

            var borough_dropdown = d3.select("#borough-dropdown")
                .on("change", function () {
                    borough = this.value;
                    if (borough === "All") {
                        overall_tooltip(severity, borough, overall_data);
                    } else {
                        d3.select("#overallText").text("");
                    }
                    map();
                });
            borough_dropdown.selectAll("option")
                .data(boroughs)
                .enter()
                .append("option")
                .attr("value", d => d)
                .text(d => d);
            borough_dropdown.property("value", borough);

            map();
        }

        function map() {
            var response_map = {};
            var values = [];
            var tip_map = {};

            borough_data.filter(d => d.severity === severity).forEach(d => {
                response_map[d.borough] = d.response_90th;
                tip_map[d.borough] = d;
            });

            var display_data = geo_data.features;
            if (borough != "All") {
                display_data = geo_data.features.filter(d => d.properties.borough === borough);
            }
            var display_geojson = {
                type: "FeatureCollection",
                features: display_data
            };

            projection = d3.geoMercator().fitExtent([[140, 80], [width - 40, height - 40]], display_geojson);
            path = d3.geoPath().projection(projection);
            color.domain([global_min, global_max]);

            svg.selectAll("#boroughs").remove();
            svg.append("g").attr("id", "boroughs");

            var boroughs_map = d3.select("#boroughs")
                .selectAll("path")
                .data(display_data);

            boroughs_map.enter()
                .append("path")
                .merge(boroughs_map)
                .attr("d", path)
                .style("fill", function (d) {
                    var val = response_map[d.properties.borough];
                    return val ? color(val) : "gray";
                })
                .style("stroke", "#fff")
                .style("stroke-width", 1.5)
                .on("mouseover", d => {
                    tip.html("<strong>" + d.properties.borough + "</strong><br/>" +
                        "Call Severity: " + severity + "<br/>" +
                        "90th Percentile Response Time: " + tip_map[d.properties.borough].response_90th.toFixed(1) + "s");
                    tip.show(d);
                })
                .on("mouseout", tip.hide);

            svg.selectAll("#legend").remove();
            var legend_width = 200;
            var legend_height = 10;
            var legend = svg.append("g")
                .attr("id", "legend")
                .attr("transform", "translate(20, 70)");
            legend.append("text")
                .attr("x", 0)
                .attr("y", -10)
                .style("font-size", "12px")
                .style("font-weight", "bold")
                .style("fill", "#fff")
                .text("90th Percentile Response Time (s)");
            legend.append("rect")
                .attr("width", legend_width)
                .attr("height", legend_height)
                .style("fill", "url(#gradient)");

            svg.select("linearGradient").remove();
            var gradient = svg.append("linearGradient")
                .attr("id", "gradient")
                .attr("x1", "0%")
                .attr("x2", "100%")
                .attr("y1", "0%")
                .attr("y2", "0%");
            gradient.selectAll("stop")
                .data(d3.range(0, 1.01, 0.01))
                .enter()
                .append("stop")
                .attr("offset", d => (d * 100) + "%")
                .attr("stop-color", d => color(global_min + d * (global_max - global_min)));

            var tick_values = d3.range(5).map(i =>
                global_min + i * (global_max - global_min) / 4
            );

            var legend_scale = d3.scaleLinear()
                .domain([global_min, global_max])
                .range([0, legend_width]);

            legend.append("g")
                .attr("transform", "translate(0," + legend_height + ")")
                .call(d3.axisBottom(legend_scale)
                    .tickValues(tick_values)
                    .tickFormat(d3.format(".0f")));

            svg.selectAll(".map-title").remove();
            svg.append("text")
                .attr("class", "map-title")
                .attr("x", width / 2)
                .attr("y", 30)
                .attr("text-anchor", "middle")
                .style("font-size", "16px")
                .style("font-weight", "bold")
                .text("90th Percentile Response Time");
            overall_tooltip(severity, borough, overall_data);
        }

        function overall_tooltip(severity, borough, overall_data) {
            svg.selectAll("#overallText").remove();

            if (borough === "All") {
                var row = overall_data.find(d => d.severity === severity);
                var group = svg.append("g")
                    .attr("id", "overallText")
                    .attr("transform", "translate(10,125)");
                group.append("rect")
                    .attr("width", 235)
                    .attr("height", 70)
                    .attr("rx", 10)
                    .attr("fill", "black")
                    .attr("stroke", "white");
                group.append("text")
                    .attr("x", 10)
                    .attr("y", 20)
                    .style("font-size", "12px")
                    .style("font-weight", "bold")
                    .text("NYC Overall");
                group.append("text")
                    .attr("x", 10)
                    .attr("y", 40)
                    .style("font-size", "12px")
                    .text("Severity: " + severity);
                group.append("text")
                    .attr("x", 10)
                    .attr("y", 55)
                    .style("font-size", "12px")
                    .text("90th Percentile Response Time: " + row.response_90th.toFixed(1) + "s");
            }
        }
    </script>

</body>

</html>
